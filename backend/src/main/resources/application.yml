server:
  # Railway (and most PaaS) inject PORT and expect the process to listen on it.
  # Local `mvn spring-boot:run` leaves PORT unset, so this stays 8080.
  port: ${PORT:8080}

spring:
  application:
    name: tutortime-backend
  # Loads application-local.yml automatically if present (it's gitignored — see
  # application-local.yml.example). Override with SPRING_PROFILES_ACTIVE in any real deployment.
  profiles:
    default: local
  datasource:
    # DB_URL wins when set (full JDBC string, including SSL). Otherwise compose from Railway's
    # MYSQL* plugin vars, falling back to a local MySQL on 3306.
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:tutortime}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

app:
  jwt:
    # This default is the public placeholder DeploymentSafety refuses to start with.
    # Local dev overrides it in application-local.yml; a real deploy must set JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-shipping-anywhere-real-0123456789}
    access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:15}
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}
  email:
    # Blank by default — EmailService just logs instead of sending until this is set.
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${EMAIL_FROM_ADDRESS:GoClass <onboarding@resend.dev>}
  # Used to build the link inside password-reset emails. A hosted process (PORT or MYSQLHOST
  # set) refuses to start if this is still the Vite default — see DeploymentSafety.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
